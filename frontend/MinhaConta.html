<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Minha Conta</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
  <link href="style/MinhaConta.css" rel="stylesheet">
</head>
<body>

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Minha Conta</h2>
      <p>Gerencie seus anúncios, imóveis favoritos e dados do perfil</p>
    </div>

    <div id="navbar"></div>
  </header>

  <main class="container conta-container">

    <div class="conta-header-bar">
      <ul class="nav nav-pills conta-tabs" id="abas-conta" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="tab-anuncios-btn" data-bs-toggle="pill" data-bs-target="#tab-anuncios" type="button" role="tab" aria-controls="tab-anuncios" aria-selected="true">
            <i class="bi bi-megaphone"></i>
            <span>Meus Anúncios</span>
            <span class="badge-contador" id="contador-anuncios">0</span>
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-favoritos-btn" data-bs-toggle="pill" data-bs-target="#tab-favoritos" type="button" role="tab" aria-controls="tab-favoritos" aria-selected="false">
            <i class="bi bi-heart"></i>
            <span>Favoritos</span>
            <span class="badge-contador" id="contador-favoritos">0</span>
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="tab-perfil-btn" data-bs-toggle="pill" data-bs-target="#tab-perfil" type="button" role="tab" aria-controls="tab-perfil" aria-selected="false">
            <i class="bi bi-person-circle"></i>
            <span>Perfil</span>
          </button>
        </li>
      </ul>

      <a href="anunciar.html" class="btn-novo-anuncio">
        <i class="bi bi-plus-lg"></i> Novo Anúncio
      </a>
    </div>

    <div class="tab-content" id="conteudo-abas-conta">

      <section class="tab-pane fade show active" id="tab-anuncios" role="tabpanel" aria-labelledby="tab-anuncios-btn">
        <div class="secao-titulo">
          <div>
            <h3>Meus Anúncios</h3>
            <p>Acompanhe o status de aprovação e gerencie seus imóveis publicados</p>
          </div>
          <select id="filtro-status-anuncio" class="select-status" aria-label="Filtrar por status">
  <option value="todos">Todos os status</option>
  <option value="ativo">Ativos</option>
  <option value="alugado">Alugados</option>
  <option value="pausado">Pausados</option>
</select>
        </div>

        <div id="lista-meus-anuncios" class="grid-cards-conta"></div>
      </section>

      <section class="tab-pane fade" id="tab-favoritos" role="tabpanel" aria-labelledby="tab-favoritos-btn">
        <div class="secao-titulo">
          <div>
            <h3>Imóveis Favoritos</h3>
            <p>Imóveis que você salvou para visitar ou comparar depois</p>
          </div>
        </div>

        <div id="lista-favoritos" class="grid-cards-conta"></div>
      </section>

      <section class="tab-pane fade" id="tab-perfil" role="tabpanel" aria-labelledby="tab-perfil-btn">
        <div class="perfil-card">
          <div class="perfil-topo">
            <div class="perfil-avatar" id="perfil-avatar">U</div>
            <div>
              <h3 id="perfil-cabecalho-nome">Usuário</h3>
              <span class="perfil-badge" id="perfil-badge-tipo">Conta Comum</span>
            </div>
          </div>

          <form id="form-perfil" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="campo-perfil" for="perfil-nome">
                  Nome de usuário
                  <div class="input-grupo-custom">
                    <i class="bi bi-person icone-campo"></i>
                    <input type="text" id="perfil-nome" name="nome" required>
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="campo-perfil" for="perfil-email">
                  E-mail
                  <div class="input-grupo-custom">
                    <i class="bi bi-envelope icone-campo"></i>
                    <input type="email" id="perfil-email" name="email" required>
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="campo-perfil" for="perfil-telefone">
                  Telefone / WhatsApp
                  <div class="input-grupo-custom">
                    <i class="bi bi-whatsapp icone-campo"></i>
                    <input type="tel" id="perfil-telefone" name="telefone" placeholder="(88) 99999-9999">
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="campo-perfil" for="perfil-cidade">
                  Cidade
                  <div class="input-grupo-custom">
                    <i class="bi bi-geo-alt icone-campo"></i>
                    <input type="text" id="perfil-cidade" name="cidade" placeholder="Ex: Quixadá - CE">
                  </div>
                </label>
              </div>
            </div>

            <p id="msg-perfil" class="msg-feedback" role="status" hidden></p>

            <div class="perfil-acoes">
              <button type="submit" class="btn-salvar-perfil">
                <i class="bi bi-check2-circle"></i> Salvar alterações
              </button>
            </div>
          </form>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components/Navbar.js"></script>
  <script src="js/MinhaConta.js"></script>
</body>
</html>
