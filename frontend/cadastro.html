<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Cadastre-se</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
  <link href="style/cadastro.css" rel="stylesheet">

 
</head>
<body>

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Crie sua conta</h2>
      <p>Cadastre-se gratuitamente para anunciar e favoritar imóveis</p>
    </div>
  </header>

  <main class="container">

    <form id="form-cadastro" novalidate>

      <label class="campo-cadastro" for="nome">
        Nome completo
        <div class="input-grupo-custom">
          <i class="bi bi-person icone-campo" aria-hidden="true"></i>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" required>
        </div>
      </label>

      <label class="campo-cadastro" for="email">
        E-mail
        <div class="input-grupo-custom">
          <i class="bi bi-envelope icone-campo" aria-hidden="true"></i>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </div>
      </label>

      <label class="campo-cadastro" for="telefone">
        Telefone / WhatsApp <span class="text-muted fw-normal">(opcional)</span>
        <div class="input-grupo-custom">
          <i class="bi bi-whatsapp icone-campo" aria-hidden="true"></i>
          <input type="tel" id="telefone" name="telefone" placeholder="(88) 99999-9999" autocomplete="tel">
        </div>
      </label>

      <label class="campo-cadastro" for="senha">
        Senha
        <div class="input-grupo-custom">
          <i class="bi bi-lock icone-campo" aria-hidden="true"></i>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" autocomplete="new-password" required>
          <button type="button" class="btn-toggle-senha" data-target="senha" aria-label="Mostrar ou ocultar senha">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <span class="dica-senha">Mínimo de 6 caracteres</span>
      </label>

      <label class="campo-cadastro" for="confirmar-senha">
        Confirmar senha
        <div class="input-grupo-custom">
          <i class="bi bi-shield-lock icone-campo" aria-hidden="true"></i>
          <input type="password" id="confirmar-senha" name="confirmar_senha" placeholder="Repita a senha" minlength="6" autocomplete="new-password" required>
          <button type="button" class="btn-toggle-senha" data-target="confirmar-senha" aria-label="Mostrar ou ocultar confirmação de senha">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </label>

      <p id="msg-erro" class="msg-erro" role="alert" aria-live="polite" hidden></p>
      <p id="msg-sucesso" class="msg-sucesso" role="status" aria-live="polite" hidden></p>

      <div class="acoes">
        <button type="submit">
          Criar conta <i class="bi bi-person-plus ms-1"></i>
        </button>
      </div>

      <p class="link-extra">
        Já tem conta? <a href="login.html">Entrar</a> ·
        <a href="index.html">Voltar ao site</a>
      </p>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/Cadastro.js"></script>
  <script>
    // Alternar visibilidade para ambos os campos de senha
    document.querySelectorAll('.btn-toggle-senha').forEach((botao) => {
      botao.addEventListener('click', () => {
        const input = document.getElementById(botao.dataset.target);
        const icone = botao.querySelector('i');
        const oculto = input.type === 'password';
        input.type = oculto ? 'text' : 'password';
        icone.className = oculto ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    });

    // Máscara simples de telefone brasileiro
    const inputTelefone = document.getElementById('telefone');
    inputTelefone.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
      } else if (v.length > 0) {
        v = `(${v}`;
      }
      e.target.value = v;
    });
  </script>
</body>
</html>
