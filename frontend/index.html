<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlugAqui - Aluguel de Imóveis</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="style/paginas.css" rel="stylesheet">
    <link href="style/home.css" rel="stylesheet">
    <link href="style/componentes.css" rel="stylesheet">
    <link href="style/navbar.css" rel="stylesheet">
    <link href="style/cardAnuncio.css" rel="stylesheet">

</head>
<body>

    <header class="topo">
        <div id="logo">
            <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
            <h2> Encontre seu lugar ideal <br> para morar</h2>
            <p>Busque casas, apartamentos e muito mais</p>
        </div>

        <div id="navbar"></div>
        
        <div id="usuario-deslogado"> 
                <a href="login.html" id="login">Entrar</a>
                <a href="cadastro.html" id="cadastrar">Cadastrar-se</a>
        </div>

    </header>

    <main class="container">

        <form id="form-busca">

            <label class="campo_busca">
                Busca:
            <input type="search" name="busca" placeholder="Buscar por título, descrição ou bairro">
            </label>


            <div class="filtros">

                <label class="campo_filtro">
                    Valor Máximo
                    <input type="number" name="precoMax" placeholder="Preço max." min="0">
                </label>
                
                
                <label class="campo_filtro">
                    Tipo de imóvel
                    <select name="tipo">
                        <option value="">Todos</option>
                        <option value="casa">Casa</option>
                        <option value="apartamento">Apartamento</option>
                        <option value="kitnet">Kitnet</option>
                        <option value="comercial">Comercial</option>
                    </select>
                </label>

                <label class="campo_filtro">
                    Quartos
                    <select name="quartos">
                        <option value="">Qualquer n° de quartos</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                        <option value="3">3+</option>
                    </select>
                </label>

                <label class="campo_filtro">
                    Banheiros
                    <select name="banheiros">
                        <option value="">Qualquer n° de banheiros</option>
                        <option value="1">1+</option>
                        <option value="2">2+</option>
                    </select>
                </label>
                
                <label class="campo_filtro">
                    Ordem
                    <select name="ordem">
                        <option value="recentes">Mais recentes</option>
                        <option value="menor_preco">Menor preço</option>
                        <option value="maior_preco">Maior preço</option>
                    </select>
                </label>

                <div class="campo_filtro" id="opcoes">
                    <label>
                        <input type="checkbox" name="aceita_pets"> Aceita pets
                    </label>

                    <label>
                        <input type="checkbox" name="mobiliado"> Mobiliado
                    </label>
                </div>
            
            </div>

            <div class="acoes">
                <button type="submit">Buscar</button>
                <button type="reset">Limpar</button>
            </div>
        </form>
    </main>


    <section id="resultados" class="container" aria-labelledby="titulo-resultados">
        <h2 id="titulo-resultados" class="visually-hidden">Anúncios disponíveis</h2>

        <p id="msg-lista" role="status" hidden></p>

        <ul id="lista-anuncios"></ul>

        <nav id="paginacao" aria-label="Paginação dos anúncios">
            <button id="btn-anterior" type="button">Anterior</button>
            <span id="info-pagina" aria-live="polite">Página 1 de 1</span>
            <button id="btn-proximo" type="button">Próxima</button>
        </nav>
    </section>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/components/Navbar.js"></script>
</body>
</html>
