<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Entrar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
  <link href="style/login.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #f1f5f9;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    /* Mantém o topo preenchendo 100% da largura horizontal */
    header.topo {
      width: 100%;
    }

    main.container {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem 3rem;
    }

    #form-login {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.08);
      padding: 2rem;
    }

    .campo-login {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 1.1rem;
    }

    .input-grupo-custom {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 0.35rem;
    }

    .input-grupo-custom .icone-campo {
      position: absolute;
      left: 0.9rem;
      color: #94a3b8;
      font-size: 1.1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .input-grupo-custom input {
      width: 100%;
      padding: 0.7rem 2.75rem 0.7rem 2.6rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
      color: #0f172a;
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    .input-grupo-custom input:focus {
      outline: none;
      background-color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .input-grupo-custom:focus-within .icone-campo {
      color: #2563eb;
    }

    .btn-toggle-senha {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: #64748b;
      padding: 0.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .btn-toggle-senha:hover {
      color: #0f172a;
    }

    .msg-erro {
      background-color: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 0.65rem;
      padding: 0.65rem 0.9rem;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .acoes button[type="submit"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: #2563eb;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .acoes button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .acoes button[type="submit"]:active {
      transform: scale(0.99);
    }

    .link-extra {
      text-align: center;
      margin-top: 1.25rem;
      margin-bottom: 0;
      font-size: 0.9rem;
      color: #64748b;
    }

    .link-extra a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .link-extra a:hover {
      text-decoration: underline;
    }

    .dica-teste {
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 0.75rem;
      font-size: 0.82rem;
      color: #475569;
    }

    .dica-teste-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .dica-teste strong {
      color: #334155;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .conta-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.35rem 0;
    }

    .conta-item + .conta-item {
      border-top: 1px solid #e2e8f0;
      margin-top: 0.25rem;
      padding-top: 0.5rem;
    }

    .btn-preencher {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 0.4rem;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #2563eb;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-preencher:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }
  </style>
</head>
<body>

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Entre na sua conta</h2>
      <p>Acesse para anunciar, favoritar e comentar</p>
    </div>
  </header>

  <main class="container">

    <form id="form-login" novalidate>

      <label class="campo-login" for="email">
        E-mail
        <div class="input-grupo-custom">
          <i class="bi bi-envelope icone-campo" aria-hidden="true"></i>
          <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="username" required>
        </div>
      </label>

      <label class="campo-login" for="senha">
        Senha
        <div class="input-grupo-custom">
          <i class="bi bi-lock icone-campo" aria-hidden="true"></i>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="button" class="btn-toggle-senha" id="toggle-senha" aria-label="Mostrar ou ocultar senha">
            <i class="bi bi-eye" id="icone-olho"></i>
          </button>
        </div>
      </label>

      <p id="msg-erro" class="msg-erro" role="alert" aria-live="polite" hidden></p>

      <div class="acoes">
        <button type="submit">
          Entrar <i class="bi bi-arrow-right-short ms-1"></i>
        </button>
      </div>

      <p class="link-extra">
        Não tem conta? <a href="cadastro.html">Cadastre-se</a> ·
        <a href="index.html">Voltar ao site</a>
      </p>

      <!-- Somente para testes -->
      <div class="dica-teste">
        <div class="dica-teste-header">
          <strong><i class="bi bi-wrench-adjustable-circle me-1"></i>Contas de teste</strong>
          <span class="text-muted" style="font-size: 0.72rem;">Clique para preencher</span>
        </div>

        <div class="conta-item">
          <div>
            <span class="d-block fw-semibold text-dark">Usuário comum</span>
            <code>usuario@teste.com</code> / <code>123456</code>
          </div>
          <button type="button" class="btn-preencher" data-email="usuario@teste.com" data-senha="123456">
            Usar
          </button>
        </div>

        <div class="conta-item">
          <div>
            <span class="d-block fw-semibold text-dark">Administrador</span>
            <code>admin@teste.com</code> / <code>admin123</code>
          </div>
          <button type="button" class="btn-preencher" data-email="admin@teste.com" data-senha="admin123">
            Usar
          </button>
        </div>
      </div>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/Login.js"></script>
  <script>
    // Alternar visibilidade da senha
    const btnToggleSenha = document.getElementById('toggle-senha');
    const inputSenha = document.getElementById('senha');
    const iconeOlho = document.getElementById('icone-olho');

    btnToggleSenha.addEventListener('click', () => {
      const oculto = inputSenha.type === 'password';
      inputSenha.type = oculto ? 'text' : 'password';
      iconeOlho.className = oculto ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // Preenchimento rápido das contas de teste
    document.querySelectorAll('.btn-preencher').forEach((botao) => {
      botao.addEventListener('click', () => {
        document.getElementById('email').value = botao.dataset.email;
        document.getElementById('senha').value = botao.dataset.senha;
        document.getElementById('email').focus();
      });
    });
  </script>
</body>
</html>
