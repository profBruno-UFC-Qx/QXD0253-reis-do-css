<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Meus anúncios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/navbar.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">

<body class="pagina-formulario">

  <header class="topo">

      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>

    <div id="navbar"></div>

  <main class="container py-4">

        <div>
          <h2 class="h5 mb-1">Meus anúncios</h2>
          <p id="resumo-meus" class="text-muted small mb-0">Carregando…</p>

      </div>

      <div id="lista-meus-anuncios" class="vstack gap-3"></div>

      <div id="msg-meus" class="alert mt-3 mb-0 d-none" role="alert"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/meus-anuncios.js"></script>
  <script type="module" src="js/components/Navbar.js"></script>

</html>
