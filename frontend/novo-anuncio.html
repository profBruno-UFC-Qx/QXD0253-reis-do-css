<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlugAqui - Anunciar imóvel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="style/paginas.css" rel="stylesheet">
  <link href="style/navbar.css" rel="stylesheet">
  <link href="style/componentes.css" rel="stylesheet">
</head>

<body class="pagina-formulario">

  <header class="topo">
    <div id="logo">
      <h1 class="marca"><i class="bi bi-houses fs-1"></i>Alug<span>Aqui</span></h1>
      <h2>Cadastre seu imóvel para alugar</h2>
    </div>
    <div id="navbar" data-ocultar="anunciar"></div>
  </header>

  <main class="container py-4">
    <form id="form-anuncio" class="form-painel">

      <h2 class="form-titulo" id="titulo-form">Novo anúncio</h2>

      <div class="mb-3">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-control" type="text" id="titulo" name="titulo" required placeholder="Ex.: Apartamento 2 quartos no Centro">
      </div>

      <div class="mb-3">
        <label class="form-label" for="descricao">Descrição</label>
        <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Destaques do imóvel"></textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label" for="preco">Preço mensal (R$)</label>
          <input class="form-control" type="number" id="preco" name="preco" required min="0" step="1" placeholder="1500">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="tipo">Tipo</label>
          <select class="form-select" id="tipo" name="tipo" required>
            <option value="">Selecione</option>
            <option value="casa">Casa</option>
            <option value="apartamento">Apartamento</option>
            <option value="kitnet">Kitnet</option>
            <option value="comercial">Comercial</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="bairro">Bairro</label>
          <input class="form-control" type="text" id="bairro" name="bairro" required placeholder="Centro">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="rua">Rua</label>
          <input class="form-control" type="text" id="rua" name="rua" placeholder="Rua Epitácio Pessoa">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="numero">Número</label>
          <input class="form-control" type="text" id="numero" name="numero" placeholder="Opcional">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="cep">CEP</label>
          <input class="form-control" type="text" id="cep" name="cep" inputmode="numeric" placeholder="63900-000" maxlength="9">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="qtd_quartos">Quartos</label>
          <input class="form-control" type="number" id="qtd_quartos" name="qtd_quartos" required min="0" value="1">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="qtd_banheiros">Banheiros</label>
          <input class="form-control" type="number" id="qtd_banheiros" name="qtd_banheiros" required min="0" value="1">
        </div>
      </div>

      <div class="checks-form mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="aceita_pets" name="aceita_pets">
          <label class="form-check-label" for="aceita_pets">Aceita pets</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="mobiliado" name="mobiliado">
          <label class="form-check-label" for="mobiliado">Mobiliado</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="imagens">Fotos</label>
        <input class="form-control" type="file" name="imagens" id="imagens" accept="image/*" multiple>
        <div class="form-text" id="ajuda-fotos">Selecione ao menos uma foto do imóvel.</div>
      </div>

      <div id="preview-fotos" class="preview-fotos mb-2" aria-live="polite"></div>

      <p id="msg-form" class="msg-form" role="alert" hidden></p>

      <div id="acoes-form" class="acoes d-flex flex-wrap gap-2 justify-content-end">
        <a class="btn btn-outline-secondary" id="link-cancelar" href="meus-anuncios.html">Cancelar</a>
        <button type="submit" class="btn btn-primary" id="btn-salvar">Publicar anúncio</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/anuncio-form.js"></script>
  <script type="module" src="js/components/Navbar.js"></script>
</body>
</html>
